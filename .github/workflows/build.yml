name: Build and release

# Every push to main and every pull request: type-check, test, build the extension and upload the zip
# as a build artifact. A tag like v0.1.0 (it must equal manifest.json's version): also create a GitHub
# release with the zip, and upload and publish it to the Chrome Web Store when the store secrets are set (as
# secrets of the protected `chrome-web-store` environment; see store/README.md).
# The e2e tests are not run here: they need a signed-in GitHub profile (see README.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version (expected v$version)."
            exit 1
          fi
      - run: npm run zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension
          path: glide-for-github.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/glide-for-github.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    # The Chrome Web Store credentials live in this environment (Settings > Environments), which should require
    # reviewers: a tag alone cannot publish. See store/README.md.
    environment: chrome-web-store
    steps:
      - name: Check for store credentials
        id: store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -n "$EXTENSION_ID" ] && [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$REFRESH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Chrome Web Store secrets not set; skipping store upload."
          fi
      # The credentials are only in the environment of the upload step below, never while installing packages.
      - if: steps.store.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.store.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - if: steps.store.outputs.configured == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension
          path: dist
      # The upload CLI is a devDependency pinned in package.json and package-lock.json (not fetched at publish time).
      - name: Install the pinned upload tool
        if: steps.store.outputs.configured == 'true'
        run: npm ci --ignore-scripts
      - name: Upload and publish to the Chrome Web Store
        if: steps.store.outputs.configured == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        # With no command it uploads, then publishes. Reads EXTENSION_ID, CLIENT_ID, CLIENT_SECRET and
        # REFRESH_TOKEN from the environment. --no-install: never download anything here.
        run: npx --no-install chrome-webstore-upload --source dist/glide-for-github.zip
