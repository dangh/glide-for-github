name: Build and release

# Every push to main and every pull request: type-check, test, build the extension and upload the zip
# as a build artifact. A tag like v0.1.0 (it must equal manifest.json's version): also create a GitHub
# release with the zip and the tag's CHANGELOG.md section as its notes (generated notes when it has none), and
# upload the zip to the Chrome Web Store and submit it for review when the store secrets are set (as secrets of the
# protected `chrome-web-store` environment, whose reviewers approve the job; see store/README.md).
# The runner image is pinned like the actions: moving to a newer Ubuntu is a reviewed change, not a surprise in a
# release job.
# The e2e tests are not run here: they need a signed-in GitHub profile (see README.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version (expected v$version)."
            exit 1
          fi
      - run: npm run zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: glide-for-github.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if sh scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::notice::CHANGELOG.md has no section for $GITHUB_REF_NAME; using generated release notes."
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/glide-for-github.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${notes[@]}"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    # The Chrome Web Store credentials live in this environment (Settings > Environments), which should require
    # reviewers: a tag alone cannot publish. See store/README.md.
    environment: chrome-web-store
    steps:
      - name: Check for store credentials
        id: store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          if [ -n "$EXTENSION_ID" ] && [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$REFRESH_TOKEN" ] && [ -n "$PUBLISHER_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Chrome Web Store secrets not set; skipping store upload."
          fi
      # The credentials are only in the environment of the upload step below, never while installing packages.
      - if: steps.store.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.store.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.store.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: dist
      # The upload CLI is a devDependency pinned in package.json and package-lock.json (not fetched at publish time).
      - name: Install the pinned upload tool
        if: steps.store.outputs.configured == 'true'
        run: npm ci --ignore-scripts
      - name: Upload to the Chrome Web Store and submit for review
        if: steps.store.outputs.configured == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        # With no command it uploads, then publishes (submits the upload for store review). Reads EXTENSION_ID, CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN
        # and PUBLISHER_ID from the environment. --no-install: never download anything here.
        run: npx --no-install chrome-webstore-upload --source dist/glide-for-github.zip
