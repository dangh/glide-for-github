name: Build and release

# Every push to main and every pull request: type-check, test, build the extension and upload the zip
# as a build artifact. A tag like v0.1.0 (it must equal manifest.json's version): also create a GitHub
# release with the zip, and upload and publish it to the Chrome Web Store when the store secrets are set.
# The e2e tests are not run here: they need a signed-in GitHub profile (see README.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version (expected v$version)."
            exit 1
          fi
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: glide-for-github.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/glide-for-github.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    # Set these in Settings > Secrets and variables > Actions. See store/README.md.
    env:
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist
      - name: Skip without store credentials
        if: env.EXTENSION_ID == '' || env.CLIENT_ID == '' || env.CLIENT_SECRET == '' || env.REFRESH_TOKEN == ''
        run: echo "::notice::Chrome Web Store secrets not set; skipping store upload."
      - uses: actions/setup-node@v4
        if: env.EXTENSION_ID != '' && env.CLIENT_ID != '' && env.CLIENT_SECRET != '' && env.REFRESH_TOKEN != ''
        with:
          node-version: 22
      - name: Upload and publish to the Chrome Web Store
        if: env.EXTENSION_ID != '' && env.CLIENT_ID != '' && env.CLIENT_SECRET != '' && env.REFRESH_TOKEN != ''
        # With no command it uploads, then publishes. Reads EXTENSION_ID, CLIENT_ID,
        # CLIENT_SECRET and REFRESH_TOKEN from the environment.
        run: npx --yes chrome-webstore-upload-cli@4 --source dist/glide-for-github.zip
