<!doctype html>
<!-- Promo tile source. render.sh screenshots it at 440x280 (small, #small), 1400x560 (marquee) and 1280x640 (social preview). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; gap: 6vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0d1117 0%, #1a2540 100%); color: #fff;
    padding: 0 9vw; box-sizing: border-box;
  }
  img { height: 50vh; }
  h1 { margin: 0 0 2.5vh; font-size: 11vh; letter-spacing: -0.02em; }
  p { margin: 0 0 4vh; font-size: 5.6vh; color: #9198a1; line-height: 1.35; max-width: 60vw; }
  .tabs { display: inline-flex; gap: 1vh; padding: 0.8vh; border-radius: 1.6vh; background: rgba(255,255,255,0.12); }
  .tabs span { padding: 1vh 2.2vh; border-radius: 1.2vh; font-size: 4.6vh; color: #d6e4ff; }
  .tabs .on { background: #2f6bed; color: #fff; font-weight: 600; }
  .credit { margin: 3.4vh 0 0; font-size: 3.6vh; color: #6e7681; }
  body.small { flex-direction: column; gap: 3vh; text-align: center; padding: 0; }
  body.small img { height: 34vh; }
  body.small h1 { font-size: 13vh; margin-bottom: 4vh; }
  body.small p, body.small .credit { display: none; }
  body.small .tabs span { font-size: 6vh; }
</style>
</head>
<body>
  <img src="../../icons/icon.svg" alt="">
  <div>
    <h1>Glide for GitHub</h1>
    <p>Fast diffs, a file tree and full review tools, right next to Files changed.</p>
    <div class="tabs"><span>Conversation</span><span>Files changed</span><span class="on">Glide</span></div>
    <div class="credit">Powered by Pierre</div>
  </div>
  <script>if (location.hash === '#small') document.body.classList.add('small');</script>
</body>
</html>
